[project]
name = "k8s-agent-server"
version = "0.3.0"
description = "K8s intelligent operations service based on agno + FastAPI"
requires-python = ">=3.12"
dependencies = [
    "agno>=2.3.21",
    "apscheduler>=3.10.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "litellm>=1.90.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/k8s_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
